name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the nightly rust-toolchain.toml pins; its component list omits
      # clippy and rustfmt.
      - run: rustup toolchain install && rustup component add clippy rustfmt
      # The UI tests link through dylint-link, and the eval in tests/eval.rs runs
      # the library through cargo-dylint. Both install outside the checkout so
      # the repo's linker setting doesn't point at the tool being built, and they
      # float because the runner discards them with the job.
      - run: cargo install --locked cargo-dylint dylint-link
        working-directory: ${{ runner.temp }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # cargo test, then the eval that plain cargo test leaves ignored.
      - run: make test
